<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>White Paper Quiz</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --border: #2a2e38;
    --text: #e8e9ed;
    --muted: #9aa0ac;
    --accent: #5b8cff;
    --good: #34c77b;
    --bad: #ef5b5b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  #app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 20px 16px 40px;
    display: flex;
    flex-direction: column;
  }
  h1 { font-size: 1.4rem; margin: 4px 0 2px; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
  }
  textarea {
    width: 100%;
    min-height: 220px;
    background: #11141a;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    font-size: 0.95rem;
    resize: vertical;
  }
  label.upload {
    display: block;
    margin-top: 14px;
    color: var(--muted);
    font-size: 0.85rem;
  }
  input[type="file"] { margin-top: 6px; width: 100%; color: var(--muted); }
  button {
    font-size: 1rem;
    border: none;
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
    width: 100%;
    margin-top: 14px;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-primary { background: var(--accent); color: #fff; font-weight: 600; }
  .btn-primary:disabled { opacity: 0.5; }
  .btn-secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .choice-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: #11141a;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-top: 10px;
    font-size: 1rem;
  }
  .choice-btn:active { background: #1c2230; }
  .progress {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 8px;
  }
  .question-text {
    font-size: 1.15rem;
    line-height: 1.45;
    margin: 6px 0 18px;
  }
  .blank { color: var(--accent); font-weight: 700; letter-spacing: 1px; }
  .result-banner {
    font-size: 1.3rem;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .result-banner.correct { color: var(--good); }
  .result-banner.incorrect { color: var(--bad); }
  .correct-answer { margin: 10px 0; font-size: 1rem; }
  .correct-answer .word { color: var(--good); font-weight: 700; }
  .explanation {
    margin-top: 14px;
    padding: 12px 14px;
    background: #11141a;
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    color: var(--muted);
    font-size: 0.92rem;
    line-height: 1.45;
    font-style: italic;
  }
  .score-big {
    font-size: 2.6rem;
    font-weight: 800;
    margin: 10px 0 0;
  }
  .score-sub { color: var(--muted); margin-bottom: 6px; }
  .hint { color: var(--muted); font-size: 0.82rem; margin-top: 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">

  <section id="setup-view">
    <h1>White Paper Quiz</h1>
    <div class="subtitle">Paste or upload a white paper. We'll build 20 multiple choice questions straight out of its own sentences &mdash; no AI, no summarizing, just the document quizzing you on itself.</div>
    <div class="card">
      <textarea id="paper-text" placeholder="Paste the white paper text here..."></textarea>
      <label class="upload">Or upload a file (.txt, .md, .pdf)</label>
      <input type="file" id="file-input" accept=".txt,.md,.pdf,text/plain,application/pdf">
      <div id="setup-status" class="hint"></div>
      <button class="btn-primary" id="generate-btn" onclick="onGenerateClicked()">Generate Quiz</button>
    </div>
  </section>

  <section id="quiz-view" hidden>
    <div class="progress" id="quiz-progress"></div>
    <div class="card">
      <div class="question-text" id="question-text"></div>
      <div id="choices"></div>
    </div>
  </section>

  <section id="result-view" hidden>
    <div class="card">
      <div class="result-banner" id="result-banner"></div>
      <div class="correct-answer" id="correct-answer"></div>
      <div class="explanation" id="explanation"></div>
      <button class="btn-primary" id="next-btn" onclick="onNextClicked()">Next Question</button>
    </div>
  </section>

  <section id="score-view" hidden>
    <div class="card">
      <h1>Quiz Complete</h1>
      <div class="score-big" id="score-big"></div>
      <div class="score-sub" id="score-sub"></div>
      <button class="btn-primary" onclick="restart()">Try Another Paper</button>
    </div>
  </section>

</div>

<script>
/* ---------- view helpers ---------- */
function showView(id) {
  ['setup-view', 'quiz-view', 'result-view', 'score-view'].forEach(v => {
    document.getElementById(v).hidden = (v !== id);
  });
}

/* ---------- state ---------- */
let questions = [];
let currentIndex = 0;
let score = 0;
let lastChoiceWasCorrect = false;

/* ---------- file upload ---------- */
document.getElementById('file-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const status = document.getElementById('setup-status');
  status.textContent = 'Reading file...';
  try {
    let text = '';
    if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
      text = await extractPdfText(file);
    } else {
      text = await file.text();
    }
    document.getElementById('paper-text').value = text;
    status.textContent = `Loaded "${file.name}" (${text.split(/\s+/).filter(Boolean).length} words).`;
  } catch (err) {
    status.textContent = 'Could not read that file. Try pasting the text directly instead.';
    console.error(err);
  }
});

async function extractPdfText(file) {
  if (!window.pdfjsLib) {
    throw new Error('pdf.js did not load (no internet connection?). Paste the text instead.');
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
  let text = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it => it.str).join(' ') + '\n';
  }
  return text;
}

/* ---------- quiz generation ---------- */
const STOPWORDS = new Set(("the a an and or but if then else when while of to in on for with as by at from this that these "
  + "those is are was were be been being have has had do does did will would shall should may might must can could not no nor "
  + "so than too very just also into over under again further here there all any both each few more most other some such only "
  + "own same it its it's their they them he she his her we our you your i me my which who whom what where why how").split(' '));

function splitSentences(text) {
  const clean = text.replace(/\s+/g, ' ').trim();
  const raw = clean.split(/(?<=[.!?])\s+(?=[A-Z0-9"“])/);
  return raw.map(s => s.trim()).filter(Boolean);
}

function isValidSentence(s) {
  const words = s.split(/\s+/).filter(Boolean);
  if (words.length < 8 || words.length > 40) return false;
  const letters = (s.match(/[A-Za-z]/g) || []).length;
  if (letters / s.length < 0.55) return false;
  if (/^\[\d/.test(s) || /^\d+\.\s*$/.test(s)) return false;
  return true;
}

const NUMBER_RE = /\b\d[\d,]*(?:\.\d+)?%?\b/g;
const CAP_PHRASE_RE = /\b[A-Z][\w-]*(?:\s+[A-Z][\w-]*){0,3}\b/g;

function findCandidate(sentence) {
  // numbers first
  const numMatches = [...sentence.matchAll(NUMBER_RE)];
  if (numMatches.length) {
    const m = numMatches[Math.floor(Math.random() * numMatches.length)];
    return { term: m[0], index: m.index, category: 'number' };
  }
  // capitalized phrase, excluding sentence-initial match
  const capMatches = [...sentence.matchAll(CAP_PHRASE_RE)].filter(m => m.index !== 0);
  if (capMatches.length) {
    const m = capMatches[Math.floor(Math.random() * capMatches.length)];
    return { term: m[0], index: m.index, category: 'cap' };
  }
  // fallback: longest non-stopword word
  const wordMatches = [...sentence.matchAll(/\b[A-Za-z]{6,}\b/g)]
    .filter(m => !STOPWORDS.has(m[0].toLowerCase()));
  if (wordMatches.length) {
    wordMatches.sort((a, b) => b[0].length - a[0].length);
    const m = wordMatches[0];
    return { term: m[0], index: m.index, category: 'word' };
  }
  return null;
}

function buildPools(sentences, candidates) {
  const pools = { number: new Set(), cap: new Set(), word: new Set() };
  candidates.forEach(c => {
    if (!c) return;
    const key = c.category === 'word' ? c.term.toLowerCase() : c.term;
    pools[c.category].add(key);
  });
  return pools;
}

function sampleDistractors(correct, category, pools, count) {
  const seen = new Set([category === 'word' ? correct.toLowerCase() : correct]);
  const out = [];
  const ordered = ['number', 'cap', 'word'].sort((a, b) => (a === category ? -1 : b === category ? 1 : 0));
  for (const cat of ordered) {
    const items = Array.from(pools[cat]).filter(x => !seen.has(x));
    shuffle(items);
    for (const item of items) {
      if (out.length >= count) break;
      out.push(item);
      seen.add(item);
    }
    if (out.length >= count) break;
  }
  while (out.length < count) out.push('None of the above');
  return out.slice(0, count);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildQuestions(text, targetCount) {
  const sentences = splitSentences(text).filter(isValidSentence);
  const candidates = sentences.map(findCandidate);
  const pools = buildPools(sentences, candidates);

  const items = sentences.map((s, i) => ({ sentence: s, candidate: candidates[i] }))
    .filter(x => x.candidate);

  shuffle(items);

  const used = new Set();
  const result = [];
  for (const item of items) {
    if (result.length >= targetCount) break;
    const { sentence, candidate } = item;
    const key = candidate.category === 'word' ? candidate.term.toLowerCase() : candidate.term;
    if (used.has(key)) continue;
    used.add(key);

    const distractors = sampleDistractors(candidate.term, candidate.category, pools, 3);
    const choices = shuffle([candidate.term, ...distractors]);
    const blanked = sentence.slice(0, candidate.index) + '_____' + sentence.slice(candidate.index + candidate.term.length);

    result.push({
      questionText: blanked,
      choices,
      correctAnswer: candidate.term,
      explanation: sentence
    });
  }
  return result;
}

/* ---------- flow ---------- */
function onGenerateClicked() {
  const text = document.getElementById('paper-text').value.trim();
  const status = document.getElementById('setup-status');
  const wordCount = text.split(/\s+/).filter(Boolean).length;
  if (wordCount < 100) {
    status.textContent = 'Paste a longer excerpt (at least a couple hundred words) so there is enough material for 20 questions.';
    return;
  }
  questions = buildQuestions(text, 20);
  if (questions.length === 0) {
    status.textContent = 'Could not extract any questions from that text. Try a different excerpt.';
    return;
  }
  currentIndex = 0;
  score = 0;
  showView('quiz-view');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentIndex];
  document.getElementById('quiz-progress').textContent = `Question ${currentIndex + 1} of ${questions.length}`;
  document.getElementById('question-text').innerHTML = escapeHtml(q.questionText).replace('_____', '<span class="blank">_____</span>');
  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  q.choices.forEach((choice) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choice;
    btn.onclick = () => onChoiceClicked(choice);
    choicesEl.appendChild(btn);
  });
}

function onChoiceClicked(choice) {
  const q = questions[currentIndex];
  lastChoiceWasCorrect = choice === q.correctAnswer;
  if (lastChoiceWasCorrect) score++;

  const banner = document.getElementById('result-banner');
  banner.textContent = lastChoiceWasCorrect ? 'Correct' : 'Incorrect';
  banner.className = 'result-banner ' + (lastChoiceWasCorrect ? 'correct' : 'incorrect');

  document.getElementById('correct-answer').innerHTML =
    `Correct answer: <span class="word">${escapeHtml(q.correctAnswer)}</span>`;
  document.getElementById('explanation').textContent = q.explanation;
  document.getElementById('next-btn').textContent =
    (currentIndex + 1 < questions.length) ? 'Next Question' : 'See Final Score';

  showView('result-view');
}

function onNextClicked() {
  currentIndex++;
  if (currentIndex >= questions.length) {
    showScore();
  } else {
    renderQuestion();
    showView('quiz-view');
  }
}

function showScore() {
  const pct = Math.round((score / questions.length) * 100);
  document.getElementById('score-big').textContent = `${score} / ${questions.length}`;
  document.getElementById('score-sub').textContent = `${pct}% correct`;
  showView('score-view');
}

function restart() {
  document.getElementById('paper-text').value = '';
  document.getElementById('file-input').value = '';
  document.getElementById('setup-status').textContent = '';
  showView('setup-view');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
