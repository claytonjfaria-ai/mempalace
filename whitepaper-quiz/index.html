<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>White Paper Quiz</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --border: #2a2e38;
    --text: #e8e9ed;
    --muted: #9aa0ac;
    --accent: #5b8cff;
    --good: #34c77b;
    --bad: #ef5b5b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  #app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 20px 16px 40px;
    display: flex;
    flex-direction: column;
  }
  h1 { font-size: 1.4rem; margin: 4px 0 2px; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
  }
  button {
    font-size: 1rem;
    border: none;
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
    width: 100%;
    margin-top: 14px;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-primary { background: var(--accent); color: #fff; font-weight: 600; }
  .choice-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: #11141a;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-top: 10px;
    font-size: 1rem;
  }
  .choice-btn:active { background: #1c2230; }
  .progress {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 8px;
  }
  .question-text {
    font-size: 1.15rem;
    line-height: 1.45;
    margin: 6px 0 18px;
  }
  .result-banner {
    font-size: 1.3rem;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .result-banner.correct { color: var(--good); }
  .result-banner.incorrect { color: var(--bad); }
  .correct-answer { margin: 10px 0; font-size: 1rem; line-height: 1.4; }
  .correct-answer .word { color: var(--good); font-weight: 700; }
  .explanation {
    margin-top: 14px;
    padding: 12px 14px;
    background: #11141a;
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    color: var(--muted);
    font-size: 0.92rem;
    line-height: 1.45;
  }
  .score-big {
    font-size: 2.6rem;
    font-weight: 800;
    margin: 10px 0 0;
  }
  .score-sub { color: var(--muted); margin-bottom: 6px; }
  .paper-title { color: var(--accent); font-weight: 600; margin: 10px 0 4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">

  <section id="intro-view">
    <h1>White Paper Quiz</h1>
    <div class="subtitle">20 questions testing your understanding of the paper's concepts and reasoning &mdash; not the exact wording.</div>
    <div class="card">
      <div class="paper-title">Spec-Driven Production Grade Development in the Age of Vibe Coding</div>
      <div class="subtitle" style="margin-bottom:0;">by Lee Boonstra</div>
      <button class="btn-primary" onclick="startQuiz()">Start Quiz</button>
    </div>
  </section>

  <section id="quiz-view" hidden>
    <div class="progress" id="quiz-progress"></div>
    <div class="card">
      <div class="question-text" id="question-text"></div>
      <div id="choices"></div>
    </div>
  </section>

  <section id="result-view" hidden>
    <div class="card">
      <div class="result-banner" id="result-banner"></div>
      <div class="correct-answer" id="correct-answer"></div>
      <div class="explanation" id="explanation"></div>
      <button class="btn-primary" id="next-btn" onclick="onNextClicked()">Next Question</button>
    </div>
  </section>

  <section id="score-view" hidden>
    <div class="card">
      <h1>Quiz Complete</h1>
      <div class="score-big" id="score-big"></div>
      <div class="score-sub" id="score-sub"></div>
      <button class="btn-primary" onclick="startQuiz()">Take Quiz Again</button>
    </div>
  </section>

</div>

<script>
/* ---------- curated question bank ----------
   Generated by reviewing the paper's content and reasoning, not by
   extracting its literal sentences. correctAnswer is always choices[0]
   in source; both question order and choice order are shuffled at runtime. */
const QUESTION_BANK = [
  {
    question: "The paper draws a line between ‘vibe coding’ and ‘vibe coding in production.’ What's the key difference?",
    choices: [
      "Vibe coding can rapidly generate code from high-level intent, but in production every output still has to be validated and intentional rather than trusted blindly.",
      "Vibe coding is only legal during prototyping and can't be used at companies above a certain size.",
      "There is no real difference — the paper treats them as the same practice under two names.",
      "Vibe coding in production means letting the agent run in YOLO mode at all times to maximize speed."
    ],
    explanation: "The paper stresses that even when teams lean on AI agents heavily, everything must stay ‘fully intended and controlled to ensure production-grade reliability, rather than relying on unvalidated AI output.’"
  },
  {
    question: "According to the paper, what has become the new bottleneck in software development now that AI can write code quickly?",
    choices: [
      "The humans who must review, integrate, and verify the flood of AI-generated code.",
      "The cost of the GPUs used to train new models.",
      "The shortage of programming languages AI can write in.",
      "The time it takes to type the original specification."
    ],
    explanation: "Implementation is no longer the constraint — ‘the bottleneck has shifted downstream to the humans who must integrate and review this work.’"
  },
  {
    question: "Why does the paper say code can be treated as ‘disposable’ under Spec-Driven Development?",
    choices: [
      "If the specification is solid, the whole codebase can be regenerated from it, so there's little emotional attachment to any one version of the code.",
      "AI-written code can't legally be copyrighted, so it has no lasting value.",
      "Disposable code means it never needs to be tested before shipping.",
      "Code is disposable only because cloud storage is cheap."
    ],
    explanation: "Per the paper: ‘If a rock-solid specification is written, the entire codebase can be regenerated repeatedly... there isn't the same emotional attachment to it.’"
  },
  {
    question: "The SkCC research cited in the paper compared formats for deeply nested configuration data. What did it find?",
    choices: [
      "YAML parsed deeply nested data far more accurately (51.9%) than JSON (43.1%) or XML (33.8%), while unoptimized generic Markdown could cost up to a 40% performance drop.",
      "JSON beat both YAML and XML by a wide margin on every nested configuration.",
      "All formats performed about the same once skill compilation was applied.",
      "XML was the most reliable format for nested data, ahead of both YAML and JSON."
    ],
    explanation: "The paper cites this exact ranking for deeply nested configs: YAML 51.9%, JSON 43.1%, XML 33.8%, with poorly formatted Markdown costing up to a 40% performance hit."
  },
  {
    question: "What's the purpose of Gherkin's ‘Scenario / Given / When / Then’ structure in a BDD spec?",
    choices: [
      "It forces the agent to think in terms of State > Action > Outcome, removing ambiguity and ‘vibe coding’ guesswork.",
      "It's a test runner that executes unit tests without needing any specification.",
      "It replaces the need for any natural-language description of requirements.",
      "It's a diagramming notation used only for database schemas."
    ],
    explanation: "The paper says Gherkin ‘forces the LLM to think in terms of State > Action > Outcome, which completely eliminates “vibe coding” and keeps the agent on a strict track.’"
  },
  {
    question: "How does the paper distinguish a shared ‘AGENTS.md’ file from a tool-specific file like ‘GEMINI.md’?",
    choices: [
      "AGENTS.md is a shared, cross-tool foundation for teams using multiple AI clients, while GEMINI.md keeps the highest priority for Google-specific project settings.",
      "AGENTS.md only works for individual developers, never for teams.",
      "GEMINI.md is being phased out entirely in favor of AGENTS.md.",
      "They serve identical purposes and can be used interchangeably."
    ],
    explanation: "AGENTS.md ‘acts as a shared cross-tool foundation’ when a team uses multiple AI clients, while ‘a local GEMINI.md file retains the highest priority for Google-specific settings.’"
  },
  {
    question: "In ‘Bug Fixing (The Forensic Specialist)’ mode, the paper recommends ‘Evidence Prompting’ over ‘Symptom Prompting.’ What does that mean?",
    choices: [
      "Instead of vaguely saying ‘the button doesn't work,’ you supply concrete evidence — like a specific error log — to drive root-cause analysis.",
      "Letting the agent guess the cause without providing any logs or context.",
      "Writing the fix yourself and having the agent only document it afterward.",
      "Switching programming languages whenever a bug is found."
    ],
    explanation: "The paper's example shifts from ‘The button doesn't work’ to ‘Logs pulled using gcloud logging read... showed a 403 error,’ then traces the exact request flow."
  },
  {
    question: "Why does the paper recommend always specifying exact library/tool version numbers in a spec?",
    choices: [
      "An agent's knowledge cutoff means it may default to suggesting older versions it was trained on unless told otherwise.",
      "Version numbers are a required part of Gherkin syntax.",
      "Newer library versions are always slower than older ones.",
      "YAML files can't store package names without version numbers."
    ],
    explanation: "The paper warns the agent ‘might suggest an older version of a tool because its “knowledge cutoff”... was in the past,’ so version numbers should always be double-checked."
  },
  {
    question: "The paper calls MCP ‘the USB-C for AI tools.’ What does that analogy capture?",
    choices: [
      "You build one MCP server for a resource (database, API, file system) and any MCP-compatible agent can use it without a custom integration each time.",
      "MCP is a physical hardware standard for connecting GPUs to AI accelerators.",
      "MCP removes the need for any specification or documentation.",
      "MCP only allows a single agent to connect to a single server at a time."
    ],
    explanation: "Per the paper: ‘You build one MCP server for your database (or API, or file system), and any MCP-compatible agent can use it without writing a custom integration.’"
  },
  {
    question: "What's the security purpose of running agent tasks inside ephemeral, low-privilege sandbox containers?",
    choices: [
      "It creates a ‘blast radius’ that confines damage from a tricked or malicious action to a disposable instance, leaving core infrastructure untouched.",
      "It makes the agent generate code faster by reducing token usage.",
      "It mainly saves cloud storage costs by compressing files.",
      "It removes the need for code review since sandboxed code is always safe."
    ],
    explanation: "Sandboxing isolates execution from the primary network and file system, so ‘if an agent is tricked into executing a destructive command, the damage is confined to a disposable instance.’"
  },
  {
    question: "What kind of actions does the paper say should require a Human-in-the-Loop (HITL) checkpoint?",
    choices: [
      "High-stakes operations with a specific risk profile, such as deploying to production, modifying database schemas, or initiating financial transactions.",
      "Every single line of code an agent writes, regardless of risk.",
      "Only cosmetic UI changes like color or font tweaks.",
      "Anything happening inside a sandbox, since sandboxed actions are already safe."
    ],
    explanation: "The paper specifies HITL gates for ‘actions that meet a specific risk profile, such as deploying code to production, modifying database schemas, or initiating financial transactions.’"
  },
  {
    question: "Why does the paper insist agents produce a failing unit test or reproduction command before attempting a bug fix?",
    choices: [
      "It proves the bug is real and reproducible, and keeping that test in the codebase stops the same bug from silently coming back later.",
      "Failing tests are a legal requirement for AI-generated commits.",
      "It lets the agent skip reading any code before making changes.",
      "It allows the agent to skip code review once a test exists."
    ],
    explanation: "The paper says to ‘always prompt for a failing unit test or a curl command... to reproduce the bug first. Keep this test case in the codebase to ensure the bug does not return.’"
  },
  {
    question: "What does the paper mean by ‘context fragmentation’ as a team-culture risk?",
    choices: [
      "A teammate changes shared code (like renaming a variable) while an agent works from an outdated snapshot, generating code that calls something that no longer exists.",
      "A model's context window simply running out of space mid-conversation.",
      "Two teams using two different programming languages on the same project.",
      "A spec file being split across multiple folders for organization."
    ],
    explanation: "The paper's example: ‘a teammate renames a variable in a shared file; an agent, quoting an outdated snapshot, mints code that calls a function that no longer exists.’"
  },
  {
    question: "What does a ‘Conditional LGTM’ let a reviewer do on a high-velocity, cross-timezone team?",
    choices: [
      "Approve a PR contingent on all automated tests passing, so it merges automatically once tests turn green, without waiting on someone in another timezone.",
      "Approve a PR without ever running it, based purely on the author's reputation.",
      "Automatically reject any PR that touches more than one file.",
      "Delay merging until every team member across all timezones has individually approved."
    ],
    explanation: "The paper describes it as approving ‘the PR contingent on it passing all automated tests; if the tests turn green, the code merges automatically’ — eliminating 12-hour cross-timezone delays."
  },
  {
    question: "Of the three tiers for deploying agents that review your repo, which trades the most control for the least setup effort — and why might a team outgrow it?",
    choices: [
      "Tier 1 (Managed); it gives a generic reviewer in minutes, but teams often outgrow it when it misses domain-specific risks, like flagging cleared boilerplate while missing unmasked PII in logs.",
      "Tier 3 (Custom); it's the simplest because it needs no infrastructure of your own.",
      "Tier 2 (Hybrid); it always uses a generic SaaS reviewer with zero customization.",
      "All three tiers offer identical control and setup effort, per the paper."
    ],
    explanation: "Tier 1 is ‘the off-the-shelf path... no prompts to write, no infrastructure to manage,’ but ‘a generic reviewer will miss what matters’ — shown by a fintech team whose managed reviewer missed unmasked PII while flagging already-cleared boilerplate."
  },
  {
    question: "What is ‘approval fatigue,’ and what statistic does the paper cite for its impact?",
    choices: [
      "Reflexively clicking ‘Approve’ on a constant stream of AI-generated micro-changes; the paper cites research showing frequent AI users are 45% more likely to report high burnout.",
      "A UI bug where the approval button stops responding after repeated clicks.",
      "A statistic showing burnout is unrelated to how often someone uses AI.",
      "A 45% increase in PR merge speed reported by frequent AI users."
    ],
    explanation: "The paper cites Quantum Workplace research, reported by CNBC: ‘frequent AI users are 45% more likely to experience high burnout than non-users.’"
  },
  {
    question: "In the Zero-Trust Development incident described in the paper, what actually caused fifty colleagues to receive false emails?",
    choices: [
      "A browser agent in auto-approve (YOLO) mode hallucinated a connection to a deprecated legacy email agent, with no human check, after a button was built without a specified URL.",
      "An external attacker phished the company's email system.",
      "A developer intentionally sent a mass test email to the whole team.",
      "A misconfigured spam filter forwarded internal drafts to outside addresses."
    ],
    explanation: "The paper: ‘Without a specified URL, the agent hallucinated by connecting to a deprecated legacy agent with no email safeguards. The result? Fifty colleagues received false emails filled with hallucinated content.’"
  },
  {
    question: "In the Policy Server pattern, what's the difference between ‘Structural Gating’ and ‘Semantic Gating’?",
    choices: [
      "Structural Gating uses fast, deterministic role/environment rules to block disallowed tools outright; Semantic Gating uses a secondary LLM to judge whether an otherwise-allowed action's content (like an email) violates policy, e.g. by containing unmasked PII.",
      "Structural Gating uses an LLM to judge intent, while Semantic Gating uses static YAML rules.",
      "They're two names for the same deterministic rule-checking mechanism.",
      "Semantic Gating only applies to database queries, never to other tool calls."
    ],
    explanation: "Structural Gating is ‘deterministic rules based on roles and environments,’ while Semantic Gating ‘uses a secondary, specialized LLM... to inspect the intent and content of a proposed action’ for things ‘you cannot regex,’ like unmasked PII."
  },
  {
    question: "Why does the paper argue traditional unit tests fall short for evaluating AI/ML-driven components like agents or classifiers?",
    choices: [
      "Their output is generated and probabilistic, not computed — a component can pass 100 unit tests yet still pick the wrong tool or hallucinate, so evaluation uses scored judgments and tolerance bands instead of binary pass/fail.",
      "Unit tests are too slow to run in a CI pipeline for ML code.",
      "ML components can't be tested by any automated method, only by humans.",
      "Unit tests only check syntax, never runtime behavior, in any system."
    ],
    explanation: "The paper: ‘an ML-driven component... can pass 100 unit tests on its tools and still fail spectacularly... Evaluation closes this gap by replacing binary assertions with scored judgments and tolerance bands.’"
  },
  {
    question: "What problem does the ContextResolver pattern (using [[VARIABLE_NAME]] placeholders) solve?",
    choices: [
      "Templates can reference placeholders that get safely resolved to runtime or environment values at execution time, so real PII never has to be hardcoded into prompts or test suites.",
      "It compiles Markdown specs into YAML automatically for faster parsing.",
      "It automatically translates code from one programming language to another.",
      "It generates unit tests automatically for any function it scans."
    ],
    explanation: "The resolver ‘replaces placeholder strings structured with double-bracket syntax [[VARIABLE_NAME]] with runtime overrides or environment configurations,’ so sensitive PII never needs to be hardcoded in test suites."
  }
];

/* ---------- state ---------- */
let questions = [];
let currentIndex = 0;
let score = 0;

/* ---------- helpers ---------- */
function showView(id) {
  ['intro-view', 'quiz-view', 'result-view', 'score-view'].forEach(v => {
    document.getElementById(v).hidden = (v !== id);
  });
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ---------- flow ---------- */
function startQuiz() {
  questions = shuffle(QUESTION_BANK.map(q => ({
    question: q.question,
    correctAnswer: q.choices[0],
    explanation: q.explanation,
    choices: shuffle(q.choices.slice())
  })));
  currentIndex = 0;
  score = 0;
  showView('quiz-view');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentIndex];
  document.getElementById('quiz-progress').textContent = `Question ${currentIndex + 1} of ${questions.length}`;
  document.getElementById('question-text').textContent = q.question;
  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  q.choices.forEach((choice) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choice;
    btn.onclick = () => onChoiceClicked(choice);
    choicesEl.appendChild(btn);
  });
}

function onChoiceClicked(choice) {
  const q = questions[currentIndex];
  const correct = choice === q.correctAnswer;
  if (correct) score++;

  const banner = document.getElementById('result-banner');
  banner.textContent = correct ? 'Correct' : 'Incorrect';
  banner.className = 'result-banner ' + (correct ? 'correct' : 'incorrect');

  document.getElementById('correct-answer').innerHTML =
    `Correct answer: <span class="word">${escapeHtml(q.correctAnswer)}</span>`;
  document.getElementById('explanation').textContent = q.explanation;
  document.getElementById('next-btn').textContent =
    (currentIndex + 1 < questions.length) ? 'Next Question' : 'See Final Score';

  showView('result-view');
}

function onNextClicked() {
  currentIndex++;
  if (currentIndex >= questions.length) {
    showScore();
  } else {
    renderQuestion();
    showView('quiz-view');
  }
}

function showScore() {
  const pct = Math.round((score / questions.length) * 100);
  document.getElementById('score-big').textContent = `${score} / ${questions.length}`;
  document.getElementById('score-sub').textContent = `${pct}% correct`;
  showView('score-view');
}
</script>
</body>
</html>
