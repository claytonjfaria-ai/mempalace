<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>White Paper Quiz</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --border: #2a2e38;
    --text: #e8e9ed;
    --muted: #9aa0ac;
    --accent: #5b8cff;
    --good: #34c77b;
    --bad: #ef5b5b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  #app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 20px 16px 40px;
    display: flex;
    flex-direction: column;
  }
  h1 { font-size: 1.4rem; margin: 4px 0 2px; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
  }
  button {
    font-size: 1rem;
    border: none;
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
    width: 100%;
    margin-top: 14px;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-primary { background: var(--accent); color: #fff; font-weight: 600; }
  .btn-secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .choice-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: #11141a;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-top: 10px;
    font-size: 1rem;
  }
  .choice-btn:active { background: #1c2230; }
  .progress {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 8px;
  }
  .question-text {
    font-size: 1.15rem;
    line-height: 1.45;
    margin: 6px 0 18px;
  }
  .result-banner {
    font-size: 1.3rem;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .result-banner.correct { color: var(--good); }
  .result-banner.incorrect { color: var(--bad); }
  .correct-answer { margin: 10px 0; font-size: 1rem; line-height: 1.4; }
  .correct-answer .word { color: var(--good); font-weight: 700; }
  .explanation {
    margin-top: 14px;
    padding: 12px 14px;
    background: #11141a;
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    color: var(--muted);
    font-size: 0.92rem;
    line-height: 1.45;
  }
  .score-big {
    font-size: 2.6rem;
    font-weight: 800;
    margin: 10px 0 0;
  }
  .score-sub { color: var(--muted); margin-bottom: 6px; }
  .paper-title { color: var(--accent); font-weight: 600; margin: 10px 0 4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">

  <section id="intro-view">
    <h1>White Paper Quiz</h1>
    <div class="subtitle">20 questions testing your understanding of the paper's concepts and reasoning &mdash; not the exact wording.</div>
    <div class="card">
      <div class="paper-title">Spec-Driven Production Grade Development in the Age of Vibe Coding</div>
      <div class="subtitle" style="margin-bottom:0;">by Lee Boonstra</div>
      <button class="btn-primary" onclick="startQuiz()">Start Quiz</button>
    </div>
  </section>

  <section id="quiz-view" hidden>
    <div class="progress" id="quiz-progress"></div>
    <div class="card">
      <div class="question-text" id="question-text"></div>
      <div id="choices"></div>
    </div>
  </section>

  <section id="result-view" hidden>
    <div class="card">
      <div class="result-banner" id="result-banner"></div>
      <div class="correct-answer" id="correct-answer"></div>
      <div class="explanation" id="explanation"></div>
      <button class="btn-primary" id="next-btn" onclick="onNextClicked()">Next Question</button>
    </div>
  </section>

  <section id="score-view" hidden>
    <div class="card">
      <h1>Quiz Complete</h1>
      <div class="score-big" id="score-big"></div>
      <div class="score-sub" id="score-sub"></div>
      <button class="btn-primary" onclick="startNewRound()">New 20 Questions</button>
      <button class="btn-secondary" onclick="onQuitClicked()">Quit</button>
    </div>
  </section>

  <section id="end-view" hidden>
    <div class="card">
      <h1>Thanks for studying</h1>
      <div class="score-big" id="end-score-big"></div>
      <div class="score-sub" id="end-score-sub"></div>
      <div class="subtitle" style="margin-top:10px; margin-bottom:0;">You can close this tab now.</div>
    </div>
  </section>

</div>

/* ---------- state ---------- */
let questions = [];
let currentIndex = 0;
let score = 0;
let lastRoundIndices = new Set();

/* ---------- helpers ---------- */
function showView(id) {
  ['intro-view', 'quiz-view', 'result-view', 'score-view', 'end-view'].forEach(v => {
    document.getElementById(v).hidden = (v !== id);
  });
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ---------- flow ---------- */
function buildRound(indices) {
  questions = shuffle(indices.map(i => {
    const q = QUESTION_BANK[i];
    return {
      question: q.question,
      correctAnswer: q.choices[0],
      explanation: q.explanation,
      choices: shuffle(q.choices.slice())
    };
  }));
  currentIndex = 0;
  score = 0;
}

function startQuiz() {
  const chosen = shuffle([...Array(QUESTION_BANK.length).keys()]).slice(0, 20);
  lastRoundIndices = new Set(chosen);
  buildRound(chosen);
  showView('quiz-view');
  renderQuestion();
}

function startNewRound() {
  const complement = [...Array(QUESTION_BANK.length).keys()].filter(i => !lastRoundIndices.has(i));
  lastRoundIndices = new Set(complement);
  buildRound(complement);
  showView('quiz-view');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentIndex];
  document.getElementById('quiz-progress').textContent = `Question ${currentIndex + 1} of ${questions.length}`;
  document.getElementById('question-text').textContent = q.question;
  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  q.choices.forEach((choice) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choice;
    btn.onclick = () => onChoiceClicked(choice);
    choicesEl.appendChild(btn);
  });
}

function onChoiceClicked(choice) {
  const q = questions[currentIndex];
  const correct = choice === q.correctAnswer;
  if (correct) score++;

  const banner = document.getElementById('result-banner');
  banner.textContent = correct ? 'Correct' : 'Incorrect';
  banner.className = 'result-banner ' + (correct ? 'correct' : 'incorrect');

  document.getElementById('correct-answer').innerHTML =
    `Correct answer: <span class="word">${escapeHtml(q.correctAnswer)}</span>`;
  document.getElementById('explanation').textContent = q.explanation;
  document.getElementById('next-btn').textContent =
    (currentIndex + 1 < questions.length) ? 'Next Question' : 'See Final Score';

  showView('result-view');
}

function onNextClicked() {
  currentIndex++;
  if (currentIndex >= questions.length) {
    showScore();
  } else {
    renderQuestion();
    showView('quiz-view');
  }
}

let finalScoreText = '';
let finalScoreSubText = '';

function showScore() {
  const pct = Math.round((score / questions.length) * 100);
  finalScoreText = `${score} / ${questions.length}`;
  finalScoreSubText = `${pct}% correct`;
  document.getElementById('score-big').textContent = finalScoreText;
  document.getElementById('score-sub').textContent = finalScoreSubText;
  showView('score-view');
}

function onQuitClicked() {
  document.getElementById('end-score-big').textContent = finalScoreText;
  document.getElementById('end-score-sub').textContent = finalScoreSubText;
  showView('end-view');
}
</script>
